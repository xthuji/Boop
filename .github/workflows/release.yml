name: Release Boop

# =============================================================================
# v* tag 触发，三平台并行构建，汇总发布到 GitHub Release。
#
# 全部构建逻辑集中在 ./scripts/run_tools.sh build（自动按当前 runner 平台分派）：
#   - macOS: 检测 x86_64 Python → PyInstaller 分别构建 arm64 + x86_64 →
#     lipo 合并主二进制与 Python.framework → ad-hoc 签名 → hdiutil 生成 DMG
#   - Linux: PyInstaller 构建 → tar.gz 打包
#   - Windows: PyInstaller 构建 → zip 打包
# 本 workflow 只做 runner 引导（checkout、Python 工具链）与产物上传，不写任何
# 构建 / 打包细节，避免与本地行为漂移。
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 Python (macos-latest 默认)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # x86_64 Python (通过 Rosetta + brew，供 run_tools.sh 内部 universal 构建使用)
      - name: Setup x86_64 Python via Rosetta
        shell: bash
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /bin/bash -c 'eval "$(/usr/local/bin/brew shellenv)" && brew install python@3.11'
          echo "/usr/local/opt/python@3.11/bin" >> "$GITHUB_PATH"

          # 验证两个架构的 Python 均可用
          echo "--- arm64 Python ---"
          python3 -V
          python3 -c "import platform; print('arch:', platform.machine())"
          python3 -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

          echo "--- x86_64 Python ---"
          arch -x86_64 /usr/local/opt/python@3.11/bin/python3 -V
          arch -x86_64 /usr/local/opt/python@3.11/bin/python3 -c "import platform; print('arch:', platform.machine())"
          arch -x86_64 /usr/local/opt/python@3.11/bin/python3 -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      # run_tools.sh 内部完成：
      #   PyInstaller arm64 构建 → PyInstaller x86_64 构建 →
      #   lipo 合并二进制 + Python.framework → ad-hoc 签名 → DMG
      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk zip

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: release/*.tar.gz

  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -lhR release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Boop ${{ github.ref_name }}
          body: |
            ## Boop ${{ github.ref_name }}

            跨平台文本处理工具。构建逻辑由 `./scripts/run_tools.sh build` 统一实现。

            ### macOS (≥ 12 Monterey)
            - `Boop_v*.dmg` — universal (arm64 + x86_64)，支持 Apple Silicon 与 Intel Mac
            - 双击 `.dmg`，把 Boop 拖进 Applications
            - 未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键应用选"打开"确认一次即可

            ### Windows
            - `Boop_v*_windows_amd64.zip` — 解压后运行 `Boop.exe`

            ### Linux
            - `Boop_v*_linux_amd64.tar.gz` — 解压后运行 `./Boop`
          files: |
            release/*.dmg
            release/*.tar.gz
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
