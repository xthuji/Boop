name: Release Boop

# =============================================================================
# v* tag 触发，三平台并行构建，汇总发布到 GitHub Release。
#
# 全部构建逻辑集中在 ./scripts/run_tools.sh build（自动按当前 runner 平台分派）：
#   - macOS: 用 python.org universal2 解释器，分别以 arm64 / x86_64(Rosetta) 运行
#     PyInstaller 构建两 slice → 以 arm64 bundle 为基线 lipo 补齐所有 Mach-O →
#     ad-hoc 签名 → hdiutil 生成 DMG
#   - Linux: PyInstaller 构建 → tar.gz 打包
#   - Windows: PyInstaller 构建 → zip 打包
# 本 workflow 只做 runner 引导（checkout、Python 工具链）与产物上传，不写任何
# 构建 / 打包细节，避免与本地行为漂移。
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # python.org universal2 解释器：同一二进制既可原生以 arm64 运行，也可经 Rosetta
      # 以 x86_64 运行。用它构建两 slice，无需再安装 Intel(x86_64) Homebrew，避免
      # ARM runner 上 "Cannot install under Rosetta 2 in ARM default prefix" 报错。
      - name: Install python.org universal2 Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          softwareupdate --install-rosetta --agree-to-license || true

          PY_FULL=3.11.9
          PY_MINOR="${PY_FULL%.*}"
          PKG_URL="https://www.python.org/ftp/python/${PY_FULL}/python-${PY_FULL}-macos11.pkg"
          curl -fsSL -o /tmp/python-universal2.pkg "$PKG_URL"
          sudo installer -pkg /tmp/python-universal2.pkg -target /

          PYBIN="/Library/Frameworks/Python.framework/Versions/${PY_MINOR}/bin/python${PY_MINOR}"
          [ -x "$PYBIN" ] || { echo "未找到 universal2 解释器: $PYBIN"; exit 1; }

          # 两个 slice 复用同一 universal2 解释器，通过环境变量告知 run_tools.sh
          echo "BOOP_PYTHON=$PYBIN"        >> "$GITHUB_ENV"
          echo "BOOP_PYTHON_X86_64=$PYBIN" >> "$GITHUB_ENV"

          # 自检：默认 arm64；arch -x86_64 前缀走 Rosetta，两者 tkinter 均可用
          echo "--- arm64 ---"
          "$PYBIN" -c "import platform,tkinter;print(platform.machine(),'tkinter',tkinter.TkVersion)"
          echo "--- x86_64 (Rosetta) ---"
          arch -x86_64 "$PYBIN" -c "import platform,tkinter;assert platform.machine()=='x86_64';print(platform.machine(),'tkinter',tkinter.TkVersion)"

      # run_tools.sh 内部完成：
      #   PyInstaller arm64 构建 → PyInstaller x86_64 构建 →
      #   以 arm64 bundle 为基线 lipo 补齐 Mach-O → ad-hoc 签名 → DMG
      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk zip

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: release/*.tar.gz

  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -lhR release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Boop ${{ github.ref_name }}
          body: |
            ## Boop ${{ github.ref_name }}

            跨平台文本处理工具。构建逻辑由 `./scripts/run_tools.sh build` 统一实现。

            ### macOS (≥ 12 Monterey)
            - `Boop_v*.dmg` — universal (arm64 + x86_64)，支持 Apple Silicon 与 Intel Mac
            - 双击 `.dmg`，把 Boop 拖进 Applications
            - 未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键应用选"打开"确认一次即可

            ### Windows
            - `Boop_v*_windows_amd64.zip` — 解压后运行 `Boop.exe`

            ### Linux
            - `Boop_v*_linux_amd64.tar.gz` — 解压后运行 `./Boop`
          files: |
            release/*.dmg
            release/*.tar.gz
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
