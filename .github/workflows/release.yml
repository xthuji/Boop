name: Release Boop

# =============================================================================
# v* tag 触发，三平台并行构建，汇总发布到 GitHub Release。
#
# 全部构建逻辑集中在 ./scripts/run_tools.sh build（自动按当前 runner 平台分派，
# 入口 run_tools.sh 声明常量与命令表，公共实现源在 run_tools_master.sh）：
#   - macOS: 单架构打包（NEEDS_UNIVERSAL=0）。用 python.org universal2 解释器，
#     矩阵分别产出 arm64（原生）与 x86_64（经 Rosetta：arch -x86_64 运行脚本），
#     各自 PyInstaller 单 slice → 修正 Info.plist → ad-hoc 签名 → hdiutil 生成 DMG；
#     产物名带架构后缀，两份独立 DMG。
#   - Linux: PyInstaller 构建 → tar.gz 打包
#   - Windows: PyInstaller 构建 → zip 打包
# 本 workflow 只做 runner 引导（checkout、Python 工具链）与产物上传，不写任何
# 构建 / 打包细节，避免与本地行为漂移。产物缺失时上传直接报错，不发空 Release。
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      # python.org universal2 解释器：同一二进制既可原生以 arm64 运行，也可经 Rosetta
      # 以 x86_64 运行。单架构构建时 arm64 job 直接用它，x86_64 job 经 arch -x86_64
      # 在其 x86_64 slice 上跑整个 run_tools.sh；无需再装 Intel Homebrew。
      - name: Install python.org universal2 Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          softwareupdate --install-rosetta --agree-to-license || true

          PY_FULL=3.11.9
          PY_MINOR="${PY_FULL%.*}"
          PKG_URL="https://www.python.org/ftp/python/${PY_FULL}/python-${PY_FULL}-macos11.pkg"
          curl -fsSL -o /tmp/python-universal2.pkg "$PKG_URL"
          sudo installer -pkg /tmp/python-universal2.pkg -target /

          PYBIN="/Library/Frameworks/Python.framework/Versions/${PY_MINOR}/bin/python${PY_MINOR}"
          [ -x "$PYBIN" ] || { echo "未找到 universal2 解释器: $PYBIN"; exit 1; }

          # 单架构构建仅需主解释器；run_tools.sh 据此选择当前 slice 运行
          echo "BOOP_PYTHON=$PYBIN" >> "$GITHUB_ENV"

          # 自检：对应矩阵 slice 下 tkinter 可用
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 "$PYBIN" -c "import platform,tkinter;assert platform.machine()=='x86_64';print('x86_64 (Rosetta) tkinter',tkinter.TkVersion)"
          else
            "$PYBIN" -c "import platform,tkinter;assert platform.machine()=='arm64';print('arm64 tkinter',tkinter.TkVersion)"
          fi

      # 单架构构建：arm64 直接跑；x86_64 用 arch -x86_64 把整个脚本置于 Rosetta
      # 下执行，脚本内 uname -m 即报 x86_64 → 产出 x86_64 单 slice .app → DMG。
      - name: Build & package via run_tools.sh
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          chmod +x ./scripts/run_tools.sh
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 ./scripts/run_tools.sh build
          else
            ./scripts/run_tools.sh build
          fi

      # 产物名带架构后缀，避免两矩阵 leg 合并到 Release 时同名覆盖。
      - name: Name DMG with arch
        shell: bash
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          for f in release/*.dmg; do
            base="$(basename "${f%.dmg}")"
            mv "$f" "release/${base}_macos_${{ matrix.arch }}.dmg"
          done
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk zip

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: release/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & package via run_tools.sh
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -lhR release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Boop ${{ github.ref_name }}
          body: |
            ## Boop ${{ github.ref_name }}

            跨平台文本处理工具。构建逻辑由 `./scripts/run_tools.sh build` 统一实现。

            ### macOS (≥ 12 Monterey，单架构产物)
            - `Boop_v*_macos_arm64.dmg` — Apple Silicon（M 系列）专用
            - `Boop_v*_macos_x86_64.dmg` — Intel Mac 专用
            - 按自己机器型号选对应架构下载；双击 `.dmg`，把 Boop 拖进 Applications
            - 未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键应用选"打开"确认一次即可

            ### Windows
            - `Boop_v*_windows_amd64.zip` — 解压后运行 `Boop.exe`

            ### Linux
            - `Boop_v*_linux_amd64.tar.gz` — 解压后运行 `./Boop`
          files: |
            release/*.dmg
            release/*.tar.gz
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
